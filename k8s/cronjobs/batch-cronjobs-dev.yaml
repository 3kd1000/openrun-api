# OpenRun 배치 작업 CronJob (DEV 환경)
# 레플리카 수와 무관하게 단일 실행 보장
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dev-schedule-maintenance
  namespace: openrun
spec:
  # 매일 KST 03:00 (UTC 18:00)
  schedule: "0 18 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: batch-caller
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  curl -X POST \
                    -H "X-Internal-Key: ${INTERNAL_BATCH_KEY}" \
                    -H "Content-Type: application/json" \
                    --fail \
                    --silent \
                    --show-error \
                    "http://openrun-api-dev-service:8080/internal/batch/execute/SCHEDULE_MAINTENANCE"
              env:
                - name: INTERNAL_BATCH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openrun-secrets-dev
                      key: INTERNAL_BATCH_KEY
