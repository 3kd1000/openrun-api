---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-cleanup
  namespace: kube-system
spec:
  # 매일 새벽 3시에 실행
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          hostPID: true
          nodeSelector:
            kubernetes.io/os: linux
          tolerations:
          - effect: NoSchedule
            operator: Exists
          containers:
          - name: cleanup
            image: alpine:3.19
            env:
              - name: INTERNAL_BATCH_KEY
                valueFrom:
                  secretKeyRef:
                    name: openrun-secrets-prod
                    key: INTERNAL_BATCH_KEY
                    optional: true
            command:
              - /bin/sh
              - -c
              - |
                echo "Installing dependencies..."
                START_TIME=$(date +%s%3N)

                # crictl 설치
                wget -q https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.29.0/crictl-v1.29.0-linux-arm64.tar.gz
                tar -xzf crictl-v1.29.0-linux-arm64.tar.gz -C /usr/local/bin/

                # jq, curl 설치
                apk add --no-cache jq curl

                # crictl 설정
                cat > /etc/crictl.yaml <<'EOF'
                runtime-endpoint: unix:///run/k3s/containerd/containerd.sock
                image-endpoint: unix:///run/k3s/containerd/containerd.sock
                timeout: 10
                EOF

                echo "=== Image Cleanup Started at $(date) ==="

                KEEP_COUNT=3
                BEFORE_COUNT=0
                AFTER_COUNT=0
                DELETED_COUNT=0
                STATUS="SUCCESS"
                ERROR_MSG=""

                # 정리 전 이미지 수
                BEFORE_COUNT=$(crictl images | grep -c "openrun" || echo "0")
                echo "Before cleanup: $BEFORE_COUNT openrun images"

                for IMAGE_NAME in "openrun-api" "openrun-frontend" "openrun-admin"; do
                  echo ""
                  echo "Processing: $IMAGE_NAME"

                  # 해당 이미지의 모든 IMAGE ID를 createdAt 역순으로 가져오기
                  IMAGE_IDS=$(crictl images --output json | \
                    jq -r ".images[] | select(.repoTags[]? | contains(\"$IMAGE_NAME\")) |
                           {id: .id, created: .createdAt} |
                           \"\(.created) \(.id)\"" | \
                    sort -rn | \
                    awk '{print $2}' | \
                    uniq)

                  if [ -z "$IMAGE_IDS" ]; then
                    echo "  No images found"
                    continue
                  fi

                  TOTAL=$(echo "$IMAGE_IDS" | wc -l)
                  echo "  Found $TOTAL unique images"

                  if [ "$TOTAL" -le "$KEEP_COUNT" ]; then
                    echo "  ✅ Keeping all $TOTAL images"
                    continue
                  fi

                  # 최근 N개를 제외한 나머지 삭제
                  TO_DELETE=$(echo "$IMAGE_IDS" | tail -n +$((KEEP_COUNT + 1)))

                  echo "$TO_DELETE" | while read IMAGE_ID; do
                    IN_USE=$(crictl ps --quiet --image "$IMAGE_ID" 2>/dev/null | wc -l)

                    if [ "$IN_USE" -gt 0 ]; then
                      echo "  ⏭️  Skipping $IMAGE_ID (in use)"
                    elif crictl rmi "$IMAGE_ID" 2>/dev/null; then
                      echo "  ✅ Deleted $IMAGE_ID"
                      DELETED_COUNT=$((DELETED_COUNT + 1))
                    else
                      echo "  ⚠️  Failed to delete $IMAGE_ID"
                    fi
                  done
                done

                # 정리 후 이미지 수
                AFTER_COUNT=$(crictl images | grep -c "openrun" || echo "0")
                DELETED_COUNT=$((BEFORE_COUNT - AFTER_COUNT))

                END_TIME=$(date +%s%3N)
                DURATION_MS=$((END_TIME - START_TIME))

                echo ""
                echo "=== Cleanup Completed at $(date) ==="
                echo "Before: $BEFORE_COUNT, After: $AFTER_COUNT, Deleted: $DELETED_COUNT"
                echo "Duration: ${DURATION_MS}ms"
                echo ""
                echo "Remaining images per repository:"
                crictl images | grep "openrun" | awk '{print $1}' | sort | uniq -c || echo "No openrun images found"

                # API로 결과 보고 (INTERNAL_BATCH_KEY가 설정된 경우에만)
                if [ -n "$INTERNAL_BATCH_KEY" ]; then
                  echo ""
                  echo "Reporting result to API..."
                  curl -X POST \
                    -H "X-Internal-Key: ${INTERNAL_BATCH_KEY}" \
                    -H "Content-Type: application/json" \
                    --silent \
                    --show-error \
                    --max-time 10 \
                    -d "{\"status\":\"${STATUS}\",\"beforeCount\":${BEFORE_COUNT},\"afterCount\":${AFTER_COUNT},\"deletedCount\":${DELETED_COUNT},\"durationMs\":${DURATION_MS}}" \
                    "http://openrun-api-production-service.openrun.svc.cluster.local:8080/internal/batch/report/IMAGE_CLEANUP" \
                    && echo "Report sent successfully" \
                    || echo "Failed to send report (non-critical)"
                else
                  echo "INTERNAL_BATCH_KEY not set, skipping API report"
                fi
            volumeMounts:
            - name: k3s-containerd
              mountPath: /run/k3s/containerd/containerd.sock
            securityContext:
              privileged: true
            resources:
              limits:
                memory: 128Mi
              requests:
                memory: 64Mi
                cpu: 100m
          volumes:
          - name: k3s-containerd
            hostPath:
              path: /run/k3s/containerd/containerd.sock
              type: Socket
