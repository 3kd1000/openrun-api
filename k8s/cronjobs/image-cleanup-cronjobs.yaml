---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-cleanup
  namespace: kube-system
spec:
  # 매일 새벽 3시에 실행
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          hostPID: true
          nodeSelector:
            kubernetes.io/os: linux
          tolerations:
          - effect: NoSchedule
            operator: Exists
          containers:
          - name: cleanup
            image: alpine:3.19
            command:
              - /bin/sh
              - -c
              - |
                echo "Installing dependencies..."

                # crictl 설치
                wget -q https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.29.0/crictl-v1.29.0-linux-arm64.tar.gz
                tar -xzf crictl-v1.29.0-linux-arm64.tar.gz -C /usr/local/bin/

                # jq 설치
                apk add --no-cache jq

                # crictl 설정
                cat > /etc/crictl.yaml <<'EOF'
                runtime-endpoint: unix:///run/k3s/containerd/containerd.sock
                image-endpoint: unix:///run/k3s/containerd/containerd.sock
                timeout: 10
                EOF

                echo "=== Image Cleanup Started at $(date) ==="

                KEEP_COUNT=3

                for IMAGE_NAME in "openrun-api" "openrun-frontend" "openrun-admin"; do
                  echo ""
                  echo "Processing: $IMAGE_NAME"

                  # 해당 이미지의 모든 IMAGE ID를 createdAt 역순으로 가져오기
                  IMAGE_IDS=$(crictl images --output json | \
                    jq -r ".images[] | select(.repoTags[]? | contains(\"$IMAGE_NAME\")) |
                           {id: .id, created: .createdAt} |
                           \"\(.created) \(.id)\"" | \
                    sort -rn | \
                    awk '{print $2}' | \
                    uniq)

                  if [ -z "$IMAGE_IDS" ]; then
                    echo "  No images found"
                    continue
                  fi

                  TOTAL=$(echo "$IMAGE_IDS" | wc -l)
                  echo "  Found $TOTAL unique images"

                  if [ "$TOTAL" -le "$KEEP_COUNT" ]; then
                    echo "  ✅ Keeping all $TOTAL images"
                    continue
                  fi

                  # 최근 N개를 제외한 나머지 삭제
                  TO_DELETE=$(echo "$IMAGE_IDS" | tail -n +$((KEEP_COUNT + 1)))

                  echo "$TO_DELETE" | while read IMAGE_ID; do
                    IN_USE=$(crictl ps --quiet --image "$IMAGE_ID" 2>/dev/null | wc -l)

                    if [ "$IN_USE" -gt 0 ]; then
                      echo "  ⏭️  Skipping $IMAGE_ID (in use)"
                    elif crictl rmi "$IMAGE_ID" 2>/dev/null; then
                      echo "  ✅ Deleted $IMAGE_ID"
                    else
                      echo "  ⚠️  Failed to delete $IMAGE_ID"
                    fi
                  done
                done

                echo ""
                echo "=== Cleanup Completed at $(date) ==="
                echo ""
                echo "Remaining images per repository:"
                crictl images | grep "openrun" | awk '{print $1}' | sort | uniq -c || echo "No openrun images found"
            volumeMounts:
            - name: k3s-containerd
              mountPath: /run/k3s/containerd/containerd.sock
            securityContext:
              privileged: true
            resources:
              limits:
                memory: 128Mi
              requests:
                memory: 64Mi
                cpu: 100m
          volumes:
          - name: k3s-containerd
            hostPath:
              path: /run/k3s/containerd/containerd.sock
              type: Socket
