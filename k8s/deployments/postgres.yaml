# PostgreSQL Deployment & Service
# 단일 PostgreSQL 인스턴스에서 prod_db, dev_db 두 개 데이터베이스 제공

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  replicas: 1  # 단일 인스턴스
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        
        # === 환경변수 설정 ===
        env:
        # Secret에서 DB 인증정보 가져오기
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: openrun-secrets-prod  # 실제로는 환경에 따라 변경
              key: SPRING_DATASOURCE_USERNAME
              
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openrun-secrets-prod
              key: SPRING_DATASOURCE_PASSWORD
              
        # ConfigMap에서 기본 DB 이름 가져오기
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: openrun-config-prod
              key: POSTGRES_DB
        
        # === 볼륨 마운트 ===
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres  # 데이터 충돌 방지
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          
        # === 헬스체크 ===
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -c
              - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 30
          periodSeconds: 10
          
        readinessProbe:
          exec:
            command:
              - /bin/bash
              - -c
              - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 5
          periodSeconds: 5
            
        # === 리소스 제한 ===
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      
      # === 볼륨 정의 ===
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-script
        configMap:
          name: postgres-init-script
          defaultMode: 0755  # 실행 권한 부여

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: default
  labels:
    app: postgres
spec:
  type: ClusterIP  # 클러스터 내부에서만 접근
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: postgres

---
# PostgreSQL PersistentVolumeClaim (데이터 영속성)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce  # 단일 노드에서만 읽기/쓰기
  resources:
    requests:
      storage: 10Gi  # 10GB 할당