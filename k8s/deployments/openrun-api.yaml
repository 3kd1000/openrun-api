# OpenRun API Deployment & Service
# Production과 Development 환경 분리

# ==========================================
# Production API Deployment
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrun-api-prod
  namespace: default
  labels:
    app: openrun-api
    env: production
spec:
  replicas: 2  # 운영환경은 2개 인스턴스
  selector:
    matchLabels:
      app: openrun-api
      env: production
  template:
    metadata:
      labels:
        app: openrun-api
        env: production
    spec:
      containers:
      - name: api
        image: ghcr.io/3kd1000/openrun:latest
        ports:
        - containerPort: 8080
        
        # === 환경변수 주입 ===
        envFrom:
        # ConfigMap에서 비민감 설정값들 가져오기
        - configMapRef:
            name: openrun-config-prod
        # Secret에서 민감정보 가져오기
        - secretRef:
            name: openrun-secrets-prod
            
        # === 볼륨 마운트 (Firebase 설정 파일) ===
        volumeMounts:
        - name: firebase-config
          mountPath: /app/config
          readOnly: true
          
        # === 헬스체크 ===
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
          
        # === 리소스 제한 ===
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
            
      # === 볼륨 정의 ===
      volumes:
      - name: firebase-config
        secret:
          secretName: firebase-service-account  # 별도 Secret으로 관리
          
      # === ImagePullSecrets (GHCR 인증) ===
      imagePullSecrets:
      - name: ghcr-pull-secret

---
# ==========================================
# Development API Deployment  
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrun-api-dev
  namespace: default
  labels:
    app: openrun-api
    env: development
spec:
  replicas: 1  # 개발환경은 1개 인스턴스
  selector:
    matchLabels:
      app: openrun-api
      env: development
  template:
    metadata:
      labels:
        app: openrun-api
        env: development
    spec:
      containers:
      - name: api
        image: ghcr.io/3kd1000/openrun:develop
        ports:
        - containerPort: 8080
        
        # === 환경변수 주입 ===
        envFrom:
        # ConfigMap에서 비민감 설정값들 가져오기 (dev용)
        - configMapRef:
            name: openrun-config-dev
        # Secret에서 민감정보 가져오기 (dev용)
        - secretRef:
            name: openrun-secrets-dev
            
        # === 볼륨 마운트 ===
        volumeMounts:
        - name: firebase-config
          mountPath: /app/config
          readOnly: true
          
        # === 헬스체크 (개발환경은 좀 더 관대하게) ===
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          
        # === 리소스 제한 (개발환경은 더 적게) ===
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
            
      volumes:
      - name: firebase-config
        secret:
          secretName: firebase-service-account
          
      imagePullSecrets:
      - name: ghcr-pull-secret

---
# ==========================================
# Production API Service
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: openrun-api-prod-service
  namespace: default
  labels:
    app: openrun-api
    env: production
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: openrun-api
    env: production

---
# ==========================================
# Development API Service
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: openrun-api-dev-service
  namespace: default
  labels:
    app: openrun-api
    env: development
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: openrun-api
    env: development