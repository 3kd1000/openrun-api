apiVersion: v1
kind: Secret
metadata:
  name: openrun-secrets-dev  # or openrun-secrets-prod
  namespace: openrun
type: Opaque
stringData:
  # Cloudflare Tunnel
  CLOUDFLARE_TUNNEL_TOKEN: "your-cloudflare-tunnel-token"

  # PostgreSQL Database
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "your-db-username"
  POSTGRES_PASSWORD: "your-db-password"

  # Spring Datasource (same as PostgreSQL)
  SPRING_DATASOURCE_USERNAME: "your-db-username"
  SPRING_DATASOURCE_PASSWORD: "your-db-password"

  # Kakao OAuth (Backend - REST API Key)
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID: "your-kakao-rest-api-key"
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET: "your-kakao-client-secret"

  # Kakao OAuth (Frontend - JavaScript Key)
  VITE_KAKAO_APP_KEY: "your-kakao-javascript-key"

  # Firebase (Frontend)
  VITE_FIREBASE_API_KEY: "your-firebase-api-key"
  VITE_FIREBASE_AUTH_DOMAIN: "your-project.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID: "your-project-id"
  VITE_FIREBASE_STORAGE_BUCKET: "your-project.appspot.com"
  VITE_FIREBASE_MESSAGING_SENDER_ID: "your-sender-id"
  VITE_FIREBASE_APP_ID: "your-app-id"
  VITE_FIREBASE_MEASUREMENT_ID: "your-measurement-id"

  # Encryption Key (Backend - AES-256)
  ENCRYPTION_KEY: "your-32-byte-base64-encoded-key"

  # Internal Batch API Key (for K8s CronJob)
  INTERNAL_BATCH_KEY: "your-random-batch-api-key"

  # Google Calendar OAuth (External Calendar Integration)
  GOOGLE_CALENDAR_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
  GOOGLE_CALENDAR_CLIENT_SECRET: "your-google-client-secret"

---
# Usage:
# 1. Copy this file to openrun-secrets-dev.yaml or openrun-secrets-prod.yaml
# 2. Replace all "your-*" placeholders with actual values
# 3. Apply to cluster: kubectl apply -f openrun-secrets-dev.yaml
# 4. DO NOT commit the actual secrets file to Git
