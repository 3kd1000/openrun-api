# OpenRun Ingress - 외부 트래픽 라우팅
# api.openrun.app → Production API
# dev.api.openrun.app → Development API

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openrun-ingress
  namespace: openrun
  annotations:
    # Ingress Controller 설정 (Traefik 사용 예정)
    kubernetes.io/ingress.class: "traefik"
    
    # SSL/TLS 설정
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    
    # CORS 설정
    traefik.ingress.kubernetes.io/frontend-rule-type: "Headers"
    
    # Rate Limiting
    traefik.ingress.kubernetes.io/rate-limit: |
      extractorfunc: client.ip
      rateset:
        rate1:
          period: 60s
          average: 100
          burst: 200
          
  labels:
    app: openrun
spec:
  # === TLS 설정 ===
  tls:
  - hosts:
    - api.openrun.app
    - dev.api.openrun.app
    secretName: openrun-tls-secret  # Let's Encrypt 인증서
    
  # === 라우팅 규칙 ===
  rules:
  # Production API (api.openrun.app)
  - host: api.openrun.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openrun-api-prod-service
            port:
              number: 8080
              
  # Development API (dev.api.openrun.app) 
  - host: dev.api.openrun.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openrun-api-dev-service
            port:
              number: 8080

---
# ==========================================
# Cloudflare Tunnel Deployment (기존 방식 유지)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: openrun
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - $(CLOUDFLARE_TUNNEL_TOKEN)
        
        env:
        - name: CLOUDFLARE_TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: openrun-secrets-prod  # Secret에서 토큰 가져오기
              key: CLOUDFLARE_TUNNEL_TOKEN
              
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

      restartPolicy: Always

---
# ==========================================
# 추가: Frontend Static File Service (향후 사용)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: openrun-frontend-service
  namespace: openrun
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: openrun-frontend