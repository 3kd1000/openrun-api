# OpenRun Admin Helm Chart - Development Environment Values

# 환경 구분
environment: dev
replicaCount: 1

# 이미지 설정
image:
  repository: ghcr.io/3kd1000/openrun-admin
  # 기본값: develop (CI/CD에서 develop-{commit-sha}로 덮어씀)
  tag: "develop"
  pullPolicy: Always

# 서비스 설정
service:
  type: ClusterIP
  port: 80

# 리소스 제한 (개발 환경)
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Ingress 설정 (Cloudflare Tunnel 사용 시 비활성화)
ingress:
  enabled: false
  host: dev-admin.openrun.app
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    enabled: true
    secretName: openrun-tls-secret

# Image Pull Secret
imagePullSecret:
  name: ghcr-pull-secret
