# OpenRun Admin Helm Chart - Production Environment Values

# 환경 구분
environment: production
replicaCount: 1

# 이미지 설정
image:
  repository: ghcr.io/3kd1000/openrun-admin
  tag: "latest"
  pullPolicy: Always

# 서비스 설정
service:
  type: ClusterIP
  port: 80

# 리소스 제한 (운영 환경 - 백오피스는 트래픽이 적으므로 프론트보다 작게)
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Ingress 설정 (Cloudflare Tunnel 사용 시 비활성화)
ingress:
  enabled: false
  host: admin.openrun.app
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    enabled: true
    secretName: openrun-tls-secret

# Image Pull Secret
imagePullSecret:
  name: ghcr-pull-secret
