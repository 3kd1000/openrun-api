apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrun-api-{{ .Values.environment }}
  namespace: openrun
  labels:
    app: openrun-api
    env: {{ .Values.environment }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: openrun-api
      env: {{ .Values.environment }}
  template:
    metadata:
      labels:
        app: openrun-api
        env: {{ .Values.environment }}
    spec:
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}

        env:
        # === 환경 설정 ===
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.springProfile | quote }}
        - name: ENVIRONMENT
          value: {{ .Values.environment | quote }}
        - name: SERVER_PORT
          value: {{ .Values.service.port | quote }}

        # === 데이터베이스 설정 ===
        - name: SPRING_DATASOURCE_URL
          value: {{ .Values.database.url | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.database.name | quote }}
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: SPRING_DATASOURCE_PASSWORD

        # === JPA & Hibernate ===
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: {{ .Values.jpa.hibernateDdlAuto | quote }}
        - name: SPRING_JPA_SHOW_SQL
          value: {{ .Values.jpa.showSql | quote }}
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL
          value: {{ .Values.jpa.formatSql | quote }}

        # === Flyway 설정 ===
        - name: SPRING_FLYWAY_ENABLED
          value: {{ .Values.flyway.enabled | quote }}
        - name: SPRING_FLYWAY_LOCATIONS
          value: {{ .Values.flyway.locations | quote }}

        # === OAuth2 설정 (민감하지 않은 부분) ===
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI
          value: {{ .Values.oauth2.kakao.redirectUri | quote }}
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_AUTHORIZATION_GRANT_TYPE
          value: {{ .Values.oauth2.kakao.authorizationGrantType | quote }}
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_AUTHENTICATION_METHOD
          value: {{ .Values.oauth2.kakao.clientAuthenticationMethod | quote }}
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_SCOPE
          value: {{ .Values.oauth2.kakao.scope | quote }}

        # === OAuth2 Client Credentials (민감 정보) ===
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET

        # === Encryption Key (AES-256) ===
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: ENCRYPTION_KEY

        # === Internal Batch API Key (K8s CronJob 인증용) ===
        - name: INTERNAL_BATCH_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: INTERNAL_BATCH_KEY

        # === OCI Object Storage (비민감 설정 - Helm values에서 주입) ===
        - name: OCI_BUCKET_NAME
          value: {{ .Values.oci.bucketName | quote }}
        - name: OCI_REGION
          value: {{ .Values.oci.region | quote }}
        - name: OCI_NAMESPACE
          value: {{ .Values.oci.namespace | quote }}

        # === OAuth2 Provider 설정 ===
        - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_AUTHORIZATION_URI
          value: {{ .Values.oauth2Provider.kakao.authorizationUri | quote }}
        - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_TOKEN_URI
          value: {{ .Values.oauth2Provider.kakao.tokenUri | quote }}
        - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_USER_INFO_URI
          value: {{ .Values.oauth2Provider.kakao.userInfoUri | quote }}
        - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_USER_NAME_ATTRIBUTE
          value: {{ .Values.oauth2Provider.kakao.userNameAttribute | quote }}

        # === Firebase 설정 ===
        - name: FIREBASE_CONFIG_PATH
          value: {{ .Values.firebase.configPath | quote }}

        # === 도메인 설정 ===
        - name: FRONTEND_URL
          value: {{ .Values.frontend.url | quote }}
        - name: API_BASE_URL
          value: {{ .Values.api.baseUrl | quote }}

        # === Actuator 설정 ===
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: {{ .Values.actuator.endpoints | quote }}
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          value: {{ .Values.actuator.showDetails | quote }}
        - name: MANAGEMENT_HEALTH_READINESSSTATE_ENABLED
          value: {{ .Values.actuator.readinessEnabled | quote }}
        - name: MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED
          value: {{ .Values.actuator.livenessEnabled | quote }}

        # === 볼륨 마운트 (Firebase 설정 파일) ===
        volumeMounts:
        - name: firebase-config
          mountPath: /app/config
          readOnly: true

        # === Startup Probe (앱 시작 완료까지 대기) ===
        # OCI Free Tier에서 Spring Boot 시작이 느리므로 충분한 시간 확보
        # 최대 대기 시간: 10초 * 30회 = 300초 (5분)
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

        # === Health Check (Liveness Probe) ===
        # startupProbe 성공 후에만 실행됨
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.service.port }}
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # === Health Check (Readiness Probe) ===
        # startupProbe 성공 후에만 실행됨
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.service.port }}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # === 리소스 제한 ===
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

      # === 볼륨 정의 ===
      volumes:
      - name: firebase-config
        secret:
          secretName: {{ .Values.firebaseSecret.name }}

      # === ImagePullSecrets (GHCR 인증) ===
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret.name }}
