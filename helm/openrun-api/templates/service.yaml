apiVersion: v1
kind: Service
metadata:
  name: openrun-api-{{ .Values.environment }}-service
  namespace: openrun
  labels:
    app: openrun-api
    env: {{ .Values.environment }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: TCP
  selector:
    app: openrun-api
    env: {{ .Values.environment }}
