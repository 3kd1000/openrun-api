# OpenRun Helm Chart - Development Environment Values

# 환경 구분
environment: dev
replicaCount: 1

# 이미지 설정
image:
  repository: ghcr.io/3kd1000/openrun
  # 기본값: develop (CI/CD에서 develop-{commit-sha}로 덮어씀)
  tag: "develop"
  pullPolicy: Always

# 서비스 설정
service:
  type: ClusterIP
  port: 8080

# 리소스 제한 (개발 환경)
resources:
  requests:
    memory: "256Mi"
    cpu: "125m"
  limits:
    memory: "512Mi"
    cpu: "250m"

# Spring Profile
springProfile: dev

# 데이터베이스 설정
database:
  url: "jdbc:postgresql://postgres-service:5432/dev_db"
  name: "postgres"

# OAuth2 설정
oauth2:
  kakao:
    redirectUri: "https://dev-front.openrun.app/login"
    authorizationGrantType: "authorization_code"
    clientAuthenticationMethod: "client_secret_post"
    scope: "profile_nickname, account_email"

# OAuth2 Provider 설정
oauth2Provider:
  kakao:
    authorizationUri: "https://kauth.kakao.com/oauth/authorize"
    tokenUri: "https://kauth.kakao.com/oauth/token"
    userInfoUri: "https://kapi.kakao.com/v2/user/me"
    userNameAttribute: "id"

# Firebase 설정
firebase:
  configPath: "/app/config/firebase-service-account.json"

# 도메인 설정
frontend:
  url: "https://dev-front.openrun.app"

api:
  baseUrl: "https://dev-api.openrun.app"

# JPA 설정 (개발 환경 - 로깅 활성화)
jpa:
  hibernateDdlAuto: "validate"
  showSql: "true"
  formatSql: "true"

# Flyway 설정
flyway:
  enabled: "true"
  locations: "classpath:db/migration"

# Actuator 설정
actuator:
  endpoints: "health,info"
  showDetails: "always"
  readinessEnabled: "true"
  livenessEnabled: "true"

# OCI Object Storage
oci:
  bucketName: "openrun-club-logos-dev"

# Secrets 이름
secrets:
  name: openrun-secrets-dev

# Firebase Secret
firebaseSecret:
  name: firebase-service-account

# Image Pull Secret
imagePullSecret:
  name: ghcr-pull-secret

# Ingress 설정 (Cloudflare Tunnel 사용 시 비활성화)
ingress:
  enabled: false
  host: dev-api.openrun.app
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/redirect-entry-point: https
  tls:
    enabled: true
    secretName: openrun-tls-secret
