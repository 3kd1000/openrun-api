# OpenRun Helm Chart - Default Values
# 환경별 설정은 values-dev.yaml 또는 values-prod.yaml로 오버라이드하세요

# 환경 구분 (필수 오버라이드)
environment: dev
replicaCount: 1

# 이미지 설정
image:
  repository: ghcr.io/3kd1000/openrun
  tag: develop
  pullPolicy: Always

# 서비스 설정
service:
  type: ClusterIP
  port: 8080

# 리소스 제한
resources:
  requests:
    memory: "256Mi"
    cpu: "125m"
  limits:
    memory: "512Mi"
    cpu: "250m"

# Spring Profile
springProfile: dev

# 데이터베이스 설정
database:
  url: "jdbc:postgresql://postgres-service:5432/dev_db"
  name: "postgres"

# OAuth2 설정
oauth2:
  kakao:
    redirectUri: "http://localhost:5173/auth-test"
    authorizationGrantType: "authorization_code"
    clientAuthenticationMethod: "client_secret_post"
    scope: "profile_nickname, account_email"

# OAuth2 Provider 설정
oauth2Provider:
  kakao:
    authorizationUri: "https://kauth.kakao.com/oauth/authorize"
    tokenUri: "https://kauth.kakao.com/oauth/token"
    userInfoUri: "https://kapi.kakao.com/v2/user/me"
    userNameAttribute: "id"

# Firebase 설정
firebase:
  configPath: "/app/config/firebase-service-account.json"

# 도메인 설정
frontend:
  url: "http://localhost:5173"

api:
  baseUrl: "http://localhost:8080"

# JPA 설정
jpa:
  hibernateDdlAuto: "validate"
  showSql: "true"
  formatSql: "true"

# Flyway 설정
flyway:
  enabled: "true"
  locations: "classpath:db/migration"

# OCI Object Storage (비민감 설정 - region/namespace는 공통, bucketName은 환경별 오버라이드)
oci:
  region: "ap-chuncheon-1"
  namespace: "axobo9eov5pd"
  bucketName: "openrun-club-logos-dev"  # 환경별 values에서 오버라이드

# Actuator 설정
actuator:
  endpoints: "health,info"
  showDetails: "always"
  readinessEnabled: "true"
  livenessEnabled: "true"

# Secrets 이름
secrets:
  name: openrun-secrets-dev

# Firebase Secret
firebaseSecret:
  name: firebase-service-account

# Image Pull Secret
imagePullSecret:
  name: ghcr-pull-secret

# Ingress 설정
ingress:
  enabled: false
  host: dev.api.openrun.app
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/redirect-entry-point: https
  tls:
    enabled: true
    secretName: openrun-tls-secret
