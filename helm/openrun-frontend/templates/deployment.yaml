apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrun-frontend-{{ .Values.environment }}
  namespace: openrun
  labels:
    app: openrun-frontend
    env: {{ .Values.environment }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: openrun-frontend
      env: {{ .Values.environment }}
  template:
    metadata:
      labels:
        app: openrun-frontend
        env: {{ .Values.environment }}
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http

        # 동적 OG 태그 서버 환경변수
        env:
        - name: API_INTERNAL_URL
          value: "http://openrun-api-{{ .Values.environment }}-service:8080/api"
        - name: SITE_URL
          value: "{{ .Values.siteUrl }}"
        - name: INTERNAL_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: INTERNAL_BATCH_KEY

        # 리소스 제한
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

      # ImagePullSecrets (GHCR 인증)
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret.name }}
