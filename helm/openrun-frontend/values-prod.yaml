# OpenRun Frontend Helm Chart - Production Environment Values

# 환경 구분
environment: production
replicaCount: 2

# 이미지 설정
image:
  repository: ghcr.io/3kd1000/openrun-frontend
  tag: "latest"
  pullPolicy: Always

# 사이트 URL (동적 OG 태그용)
siteUrl: "https://front.openrun.app"

# 서비스 설정
service:
  type: ClusterIP
  port: 80

# 리소스 제한 (운영 환경)
resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "512Mi"
    cpu: "300m"

# Ingress 설정 (Cloudflare Tunnel 사용 시 비활성화)
ingress:
  enabled: false
  host: front.openrun.app
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    enabled: true
    secretName: openrun-tls-secret

# Secrets (API와 동일한 K8s Secret 참조)
secrets:
  name: openrun-secrets-prod

# Image Pull Secret
imagePullSecret:
  name: ghcr-pull-secret
