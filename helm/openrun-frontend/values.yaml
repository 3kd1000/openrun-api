# OpenRun Frontend Helm Chart - Default Values

# 환경 구분
environment: dev
replicaCount: 1

# 이미지 설정
image:
  repository: ghcr.io/3kd1000/openrun-frontend
  tag: develop
  pullPolicy: Always

# 사이트 URL (동적 OG 태그용)
siteUrl: "https://dev-front.openrun.app"

# 서비스 설정
service:
  type: ClusterIP
  port: 80

# 리소스 제한 (개발 환경)
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Secrets (API와 동일한 K8s Secret 참조)
secrets:
  name: openrun-secrets-dev

# Ingress 설정 (비활성화 - Cloudflare Tunnel 사용)
ingress:
  enabled: false
