name: Deploy API to Production

on:
  push:
    branches: ["production"]
    paths:
      - "api/**"
      - "gradle/**"
      - "build.gradle"
      - "Dockerfile.api"
      - ".github/workflows/ci-cd-api-prod.yml"

jobs:
  # ========== 빌드 Job ==========
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      # --- 1. 소스코드 체크아웃 ---
      - name: Checkout source code
        uses: actions/checkout@v4

      # --- 2. GitHub Container Registry(GHCR)에 로그인 ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. Docker 이미지 빌드 및 푸시 (API 전용) ---
      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          no-cache: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-api:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-api:${{ github.sha }}

  # ========== 배포 Job ==========
  deploy-api:
    needs: build-and-push-api
    runs-on: ubuntu-latest
    steps:
      # --- 1. 코드 체크아웃 ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 2. API Helm Chart를 서버로 전송 (SCP) ---
      - name: Copy API Helm Chart to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "helm/openrun-api/*"
          target: "/home/ubuntu/openrun/helm/openrun-api"
          strip_components: 2
          overwrite: true

      # --- 3. Helm으로 API 배포 실행 (SSH) ---
      - name: Deploy API with Helm
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ubuntu/openrun

            # API Helm 배포
            helm upgrade --install openrun-api-prod helm/openrun-api \
              -f helm/openrun-api/values-prod.yaml \
              --set image.repository=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-api \
              --set image.tag=${{ github.sha }} \
              -n openrun \
              --wait \
              --timeout 5m

            # 배포 상태 확인
            echo "=== API Production Deployment Status ==="
            kubectl get pods -n openrun -l app=openrun-api,env=production

            echo "=== Helm Releases ==="
            helm list -n openrun
