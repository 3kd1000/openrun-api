# 워크플로우의 이름을 지정합니다. GitHub 레포지토리의 'Actions' 탭에 이 이름이 표시됩니다.
name: OpenRun CI/CD Pipeline

# 'on' 섹션: 어떤 이벤트가 발생했을 때 이 워크플로우를 실행할지 정의합니다.
on:
  # 'push' 이벤트에 대해 설정합니다.
  push:
    # 'develop' 브랜치에 push가 발생할 때만 이 워크플로우를 트리거(실행)합니다.
    # main, feature/* 등 다른 브랜치를 추가할 수도 있습니다.
    branches: [ "develop" ]

# 'jobs' 섹션: 워크플로우에서 실행될 하나 이상의 작업(job)들을 정의합니다.
jobs:
  # 'build-and-push' 라는 이름의 작업을 정의합니다.
  build-and-push:
    # 'runs-on': 이 작업을 실행할 가상 머신(Runner)의 종류를 지정합니다.
    # 'ubuntu-latest'는 GitHub에서 제공하는 최신 버전의 우분투 리눅스 환경입니다.
    runs-on: ubuntu-latest

    # 'steps' 섹션: 작업 안에서 순차적으로 실행될 단계들을 정의합니다.
    steps:
      # --- 1. 소스코드 체크아웃 ---
      # 'uses' 키워드는 다른 사람이 만들어 둔 액션(미리 정의된 스크립트 묶음)을 사용하겠다는 의미입니다.
      # 'actions/checkout@v4'는 GitHub에서 공식적으로 제공하는 액션으로,
      # 워크플로우를 실행하는 가상 머신에 현재 레포지토리의 소스코드를 내려받는 역할을 합니다.
      - name: Checkout source code
        uses: actions/checkout@v4

      # --- 2. GitHub Container Registry(GHCR)에 로그인 ---
      # Docker 이미지를 빌드한 후, 우리만의 비공개 저장소인 GHCR에 저장하기 위해 로그인이 필요합니다.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. Docker 이미지 빌드 및 푸시 ---
      # 'docker/build-push-action'은 Docker 이미지를 빌드하고 레지스트리에 푸시하는 과정을 자동화해주는 강력한 액션입니다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # 'context: .'는 Dockerfile을 찾을 위치를 지정합니다. '.'는 프로젝트 루트 디렉토리를 의미합니다.
          context: .
          # 사용할 Dockerfile의 경로를 명시적으로 지정합니다.
          file: ./Dockerfile
          # 'push: true'로 설정해야 빌드 완료 후 GHCR로 이미지를 푸시합니다. (false이면 빌드만 수행)
          push: true
          # linux/amd64(Intel/AMD)와 linux/arm64(Apple Silicon/Oracle Ampere) 아키텍처를 모두 지원하는
          # 멀티 플랫폼 이미지를 빌드합니다.
          platforms: linux/amd64, linux/arm64
          # 'tags': 생성될 이미지의 이름과 태그를 지정합니다.
          # ghcr.io/소유자이름/레포지토리이름:태그 형식입니다.
          # 여기서는 'latest' 태그를 사용하며, 소유자 이름과 레포지토리 이름은 동적으로 가져옵니다.
          # 예: ghcr.io/wisdomhill/openrun:latest
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
