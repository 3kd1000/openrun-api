name: Deploy Frontend to Production

on:
  push:
    branches: ["main"]
    paths:
      - "front/**"
      - "Dockerfile.front"
      - ".github/workflows/ci-cd-front-prod.yml"

jobs:
  # ========== 빌드 Job ==========
  build-and-push-front:
    runs-on: ubuntu-latest

    steps:
      # --- 1. 소스코드 체크아웃 ---
      - name: Checkout source code
        uses: actions/checkout@v4

      # --- 2. GitHub Container Registry(GHCR)에 로그인 ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. Docker 이미지 빌드 및 푸시 (Frontend 전용) ---
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.front
          push: true
          no-cache: true
          platforms: linux/amd64, linux/arm64
          build-args: |
            BUILD_COMMAND=npm run build
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ github.sha }}

  # ========== 배포 Job ==========
  deploy-front:
    needs: build-and-push-front
    runs-on: ubuntu-latest
    steps:
      # --- 1. 코드 체크아웃 ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 2. Frontend Helm Chart를 서버로 전송 (SCP) ---
      - name: Copy Frontend Helm Chart to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "helm/openrun-frontend/*"
          target: "/home/ubuntu/openrun/helm/openrun-frontend"
          strip_components: 2
          overwrite: true

      # --- 3. Helm으로 Frontend 배포 실행 (SSH) ---
      - name: Deploy Frontend with Helm
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ubuntu/openrun

            # Frontend Helm 배포
            helm upgrade --install openrun-frontend-prod helm/openrun-frontend \
              -f helm/openrun-frontend/values-prod.yaml \
              --set image.repository=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend \
              --set image.tag=${{ github.sha }} \
              -n openrun \
              --wait \
              --timeout 5m

            # 배포 상태 확인
            echo "=== Frontend Production Deployment Status ==="
            kubectl get pods -n openrun -l app=openrun-frontend,env=production

            echo "=== Helm Releases ==="
            helm list -n openrun
