# Gradle 성능 최적화 설정

# 병렬 빌드 활성화
org.gradle.parallel=true

# 병렬 빌드 워커 수 설정 (CPU 코어 수 기반)
# arm64 서버에서 안정적으로 동작하기 위해 4로 제한
org.gradle.workers.max=4

# 빌드 캐시 활성화
org.gradle.build.cache=true

# 설정 온디맨드 활성화 (불필요한 프로젝트 평가 생략)
org.gradle.configureondemand=true

# 대몬 메모리 증가 (컴파일 속도 개선)
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC
