# ===============================
# FIREBASE (개발 서버에서는 Firebase 활성화)
# ===============================
firebase.enabled=true
firebase.config.path=config/firebase-service-account.json

# ===============================
# FLYWAY (dev 환경에서는 테스트 데이터 마이그레이션 포함)
# ===============================
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
