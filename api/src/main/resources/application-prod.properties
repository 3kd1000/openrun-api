# ===============================
# FIREBASE (프로덕션 서버에서는 Firebase 활성화)
# ===============================
firebase.enabled=true
firebase.config.path=config/firebase-service-account.json

# ===============================
# FLYWAY (프로덕션 환경에서는 기본 마이그레이션만 실행, 테스트 데이터 제외)
# ===============================
spring.flyway.locations=classpath:db/migration

# ===============================
# WEBAUTHN (프로덕션 서버용)
# ===============================
webauthn.rp-id=openrun.app
webauthn.rp-name=OpenRun
webauthn.timeout=60000

# ===============================
# JPA (프로덕션에서는 SQL 로그 최소화)
# ===============================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# LOGGING (프로덕션 로그 레벨)
# ===============================
# 기본 레벨
logging.level.root=INFO
logging.level.com.example.openrunapi=INFO

# Hibernate 로그 최소화 (쿼리 파라미터, 트랜잭션 등)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=WARN

# HikariCP 커넥션 풀 로그 최소화
logging.level.com.zaxxer.hikari=WARN

# Spring Framework 내부 로그 최소화
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
