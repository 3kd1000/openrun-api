<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>OpenRun OG Image - Sample C</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 60px 20px;
    font-family: 'Noto Sans KR', sans-serif;
    color: #fff;
  }

  .og-canvas {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    background: #ffffff;
  }

  .green-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: linear-gradient(180deg, #059669, #10b981, #34d399);
  }

  .accent-shape {
    position: absolute;
    right: -80px;
    top: -80px;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
  }

  .accent-shape2 {
    position: absolute;
    right: 60px;
    bottom: -120px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 100px;
    z-index: 2;
  }

  .logo-section {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .logo-icon {
    width: 80px;
    height: 80px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(5, 150, 105, 0.25);
  }

  .logo-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .logo-text {
    font-size: 58px;
    font-weight: 900;
    color: #111827;
  }

  .logo-text span {
    color: #059669;
    margin-left: 8px;
  }

  .divider {
    width: 60px;
    height: 4px;
    background: #10b981;
    border-radius: 2px;
    margin-bottom: 20px;
  }

  .tagline {
    font-size: 26px;
    color: #374151;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .sub-tagline {
    font-size: 18px;
    color: #6b7280;
    font-weight: 400;
    margin-bottom: 32px;
  }

  .features {
    display: flex;
    gap: 24px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    color: #374151;
    font-weight: 500;
  }

  .feature-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
  }

  /* Scale for viewing */
  .scale-wrapper {
    transform: scale(0.6);
    transform-origin: top center;
    margin-bottom: -252px;
  }

  .note {
    font-size: 14px;
    color: #666;
  }
</style>
</head>
<body>

<div class="scale-wrapper">
  <div class="og-canvas">
    <div class="green-bar"></div>
    <div class="accent-shape"></div>
    <div class="accent-shape2"></div>
    <div class="content">
      <div class="logo-section">
        <div class="logo-icon">
          <img src="icon-512x512-v4.png" alt="OpenRun">
        </div>
        <div class="logo-text">Open<span>Run</span></div>
      </div>
      <div class="divider"></div>
      <div class="tagline">테니스 클럽 관리 서비스</div>
      <div class="sub-tagline">일정부터 경기 기록까지, 클럽 운영의 모든 것</div>
      <div class="features">
        <div class="feature-item"><div class="feature-dot"></div>일정 관리</div>
        <div class="feature-item"><div class="feature-dot"></div>참가 신청</div>
        <div class="feature-item"><div class="feature-dot"></div>대진표 생성</div>
        <div class="feature-item"><div class="feature-dot"></div>경기 기록</div>
      </div>
    </div>
  </div>
</div>

<p class="note">1200×630px · Sample C with actual logo</p>

</body>
</html>
